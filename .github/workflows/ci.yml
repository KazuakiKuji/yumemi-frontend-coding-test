name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
      # 既存コードに lint 警告があるため、警告をエラー扱いにしない
      - run: npm run build
        env:
          CI: false
